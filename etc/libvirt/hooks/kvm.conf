# Logfile location
LOGFILE="/var/log/gpu_passthrough.log"

# Define GPU PCI addresses (adjust as necessary)
GPU_PCI="0000:01:00.0"
AUDIO_PCI="0000:01:00.1"

# CPU isolation (host CPU pinning while a VM is running).
# HOST_CPUS: the CPUs the host (user/system/init slices) is confined to while
#            the VM runs. The remaining CPUs should match the VM's <vcpupin>.
# ALL_CPUS:  the full CPU range restored to the host after the VM shuts down.
# Same hardware as the old Arch box, so these are unchanged.
HOST_CPUS="0,1,2,3"
ALL_CPUS="0-11"
